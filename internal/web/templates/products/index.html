{{ define "products/index.html" }}
<section class="page-header">
  <div>
    <h1>Products</h1>
    <p class="muted">Reusable catalog items for faster order creation.</p>
  </div>
  <a href="/products/new" class="btn-primary">New product</a>
</section>

{{ if .FlashNotice }}<div class="flash flash-notice">{{ .FlashNotice }}</div>{{ end }}
{{ if .FlashError }}<div class="flash flash-error">{{ .FlashError }}</div>{{ end }}

<form class="orders-filters"
      hx-get="/products"
      hx-trigger="input changed delay:300ms from:input[name='q'], change from:input[name='archived'], submit"
      hx-target="#products-table"
      hx-swap="outerHTML"
      hx-push-url="true">
  <input type="search" name="q" value="{{ .Query }}" placeholder="Search by name or SKU…" autocomplete="off">
  <label class="checkbox-inline">
    <input type="checkbox" name="archived" value="1" {{ if .IncludeArch }}checked{{ end }}>
    Show archived
  </label>
</form>

{{ template "products/_table.html" . }}
{{ end }}
