{{ define "products/_picker.html" }}
{{ if not .Products }}
  <div class="p-space-lg text-center">
    <p class="font-body-md text-body-md text-on-surface-variant">No products found.</p>
  </div>
{{ else }}
  <ul class="divide-y divide-outline-variant/20">
    {{ range .Products }}
      <li>
        <button type="button" class="picker-item w-full flex items-center justify-between p-space-md hover:bg-surface-container transition-colors text-left"
                data-name="{{ .Name }}"
                data-price="{{ printf "%.2f" (divf .UnitPrice.Amount 100) }}"
                data-desc="{{ .Description }}">
          <div class="flex flex-col min-w-0">
            <span class="font-label-md text-label-md font-semibold text-on-surface truncate">{{ .Name }}</span>
            {{ if .SKU }}<span class="font-code-md text-code-md text-on-surface-variant">{{ .SKU }}</span>{{ end }}
          </div>
          <span class="font-code-md text-code-md font-bold text-primary tabular-nums whitespace-nowrap ml-space-sm">{{ currency .UnitPrice.Amount .Currency }}</span>
        </button>
      </li>
    {{ end }}
  </ul>
{{ end }}
{{ end }}
