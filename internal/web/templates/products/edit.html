{{ define "products/edit.html" }}
<section class="page-header">
  <h1>Edit {{ .Product.Name }}</h1>
  <a href="/products" class="btn-secondary">← Back</a>
</section>

{{ if .Error }}<div class="flash flash-error">{{ .Error }}</div>{{ end }}

<form method="post" action="/products/{{ .Product.ID }}" class="form form-wide">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

  <label>
    Name *
    <input type="text" name="name" value="{{ .FormName }}" required maxlength="200">
  </label>

  <label>
    SKU
    <input type="text" name="sku" value="{{ .FormSKU }}" maxlength="64">
  </label>

  <label>
    Unit price *
    <input type="text" name="unit_price" value="{{ .FormPrice }}" required>
  </label>

  <label>
    Description
    <textarea name="description" rows="3" maxlength="5000">{{ .FormDesc }}</textarea>
  </label>

  <div class="form-actions">
    <button type="submit" class="btn-primary">Save changes</button>
    <a href="/products" class="btn-secondary">Cancel</a>
  </div>
</form>
{{ end }}
