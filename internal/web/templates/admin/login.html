{{ define "admin/login.html" }}
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight mb-space-lg">Admin sign in</h1>

{{ if .Error }}<div role="alert" class="mb-space-md p-space-sm rounded bg-error-container text-on-error-container text-label-md font-label-md">{{ .Error }}</div>{{ end }}

<form method="post" action="{{ .Path }}/login" class="flex flex-col gap-space-md">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

  <label class="flex flex-col gap-1">
    <span class="text-label-md font-label-md text-on-surface">Email</span>
    <input type="email" name="email" required autofocus autocomplete="username"
           class="h-10 px-3 rounded bg-surface-container-low text-on-surface font-body-md focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-container">
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-label-md font-label-md text-on-surface">Password</span>
    <input type="password" name="password" required autocomplete="current-password"
           class="h-10 px-3 rounded bg-surface-container-low text-on-surface font-body-md focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-container">
  </label>

  <button type="submit" class="h-10 rounded bg-error text-on-error hover:opacity-90 text-label-md font-label-md transition-opacity">
    Sign in to admin
  </button>
</form>
{{ end }}
