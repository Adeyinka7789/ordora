{{ define "customers/edit.html" }}
<section class="page-header">
  <h1>Edit customer</h1>
  <a href="/customers/{{ .Customer.ID }}" class="btn-secondary">← Back</a>
</section>

{{ if .Error }}<div class="flash flash-error">{{ .Error }}</div>{{ end }}

<form method="post" action="/customers/{{ .Customer.ID }}" class="form form-wide">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

  <label>
    Name *
    <input type="text" name="name" value="{{ .Customer.Name }}" required autofocus maxlength="200">
  </label>

  <label>
    Email
    <input type="email" name="email" value="{{ .Customer.Email }}" maxlength="254">
  </label>

  <label>
    Phone
    <input type="tel" name="phone" value="{{ .Customer.Phone }}" maxlength="40">
  </label>

  <label>
    Address
    <textarea name="address" rows="2" maxlength="500">{{ .Customer.Address }}</textarea>
  </label>

  <label>
    Notes
    <textarea name="notes" rows="4" maxlength="5000">{{ .Customer.Notes }}</textarea>
  </label>

  <div class="form-actions">
    <button type="submit" class="btn-primary">Save changes</button>
    <a href="/customers/{{ .Customer.ID }}" class="btn-secondary">Cancel</a>
  </div>
</form>
{{ end }}
