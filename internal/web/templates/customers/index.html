{{ define "customers/index.html" }}
<section class="page-header">
  <div>
    <h1>Customers</h1>
    <p class="muted">Manage the people and businesses you sell to.</p>
  </div>
  <a href="/customers/new" class="btn-primary">New customer</a>
</section>

{{ if .FlashNotice }}<div class="flash flash-notice">{{ .FlashNotice }}</div>{{ end }}
{{ if .FlashError }}<div class="flash flash-error">{{ .FlashError }}</div>{{ end }}

<form class="search-bar"
      hx-get="/customers"
      hx-trigger="input changed delay:300ms from:input[name='q'], submit"
      hx-target="#customers-table"
      hx-swap="outerHTML">
  <input type="search" name="q" value="{{ .Query }}" placeholder="Search by name, email, or phone…" autocomplete="off">
</form>

{{ template "customers/_table.html" . }}
{{ end }}
