{{ define "orders/edit.html" }}
<section class="page-header">
  <h1>Edit {{ .Order.Number }}</h1>
  <a href="/orders/{{ .Order.ID }}" class="btn-secondary">← Back to order</a>
</section>

{{ if .Error }}<div class="flash flash-error">{{ .Error }}</div>{{ end }}

<form method="post" action="/orders/{{ .Order.ID }}" class="order-form" id="order-form">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">
  <input type="hidden" name="item_count" id="item-count" value="{{ len .FormItems }}">

  <div class="form-row">
    <label>
      Customer
      <input type="text" value="{{ range .Customers }}{{ if eq $.FormCustID (printf "%s" .ID) }}{{ .Name }}{{ end }}{{ end }}" disabled>
    </label>
    <label>
      Expected completion
      <input type="date" name="expected_completion" value="{{ .FormDueDate }}">
    </label>
  </div>

  <label>
    Title *
    <input type="text" name="title" value="{{ .FormTitle }}" required maxlength="200">
  </label>

  <label>
    Description
    <textarea name="description" rows="2" maxlength="5000">{{ .FormDesc }}</textarea>
  </label>

  <fieldset class="items-fieldset">
    <legend>Items</legend>
    <table class="items-table" id="items-table">
      <thead>
        <tr>
          <th>Description</th>
          <th class="qty-col">Quantity</th>
          <th class="price-col">Unit price</th>
          <th class="sub-col">Subtotal</th>
          <th class="act-col"></th>
        </tr>
      </thead>
      <tbody id="items-body">
        {{ range $i, $it := .FormItems }}
          <tr class="item-row">
            <td><input type="text" name="items[{{ $i }}][description]" value="{{ $it.Description }}" required></td>
            <td><input type="text" name="items[{{ $i }}][quantity]" value="{{ $it.Quantity }}" class="qty-input" required></td>
            <td><input type="text" name="items[{{ $i }}][unit_price]" value="{{ $it.UnitPrice }}" class="price-input" required></td>
            <td class="subtotal-cell">—</td>
            <td><button type="button" class="remove-item" aria-label="Remove item">×</button></td>
          </tr>
        {{ end }}
      </tbody>
    </table>
    <div class="items-actions">
      <button type="button" id="add-item" class="btn-secondary">+ Add blank item</button>
      <button type="button" id="pick-product" class="btn-secondary"> Add from catalog</button>
    </div>
  </fieldset>

  <div id="product-picker" class="product-picker" hidden>
    <div class="picker-header">
      <input type="search" id="picker-search" name="q" placeholder="Search products…"
             hx-get="/products/picker"
             hx-trigger="input changed delay:300ms, load"
             hx-target="#picker-results"
             hx-swap="innerHTML"
             autocomplete="off">
      <button type="button" id="picker-close" class="btn-secondary btn-tiny">Close</button>
    </div>
    <div id="picker-results"></div>
  </div>

  <div class="form-row">
    <label>
      Discount (optional)
      <input type="text" name="discount" value="{{ .FormDisc }}" placeholder="0.00">
    </label>
    <label>
      Tax (optional)
      <input type="text" name="tax" value="{{ .FormTax }}" placeholder="0.00">
    </label>
  </div>

  <div class="order-totals">
    <div><span>Subtotal:</span> <span id="subtotal">0.00</span></div>
    <div><span>Discount:</span> <span id="discount-total">0.00</span></div>
    <div><span>Tax:</span> <span id="tax-total">0.00</span></div>
    <div class="total"><span>Total:</span> <span id="grand-total">0.00</span></div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-primary">Save changes</button>
    <a href="/orders/{{ .Order.ID }}" class="btn-secondary">Cancel</a>
  </div>
</form>

<script src="/static/js/orders.js" defer></script>
{{ end }}
