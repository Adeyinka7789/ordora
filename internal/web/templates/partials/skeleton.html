{{ define "partials/skeleton.html" }}
{{/* Central HTMX skeleton definitions.

  Included ONCE in layouts/app.html (outside any hx-target). The <template>
  elements below are inert by default and are cloned by /static/js/skeleton.js
  into the swap target's innerHTML while an HTMX request is in flight.

  HTMX rigidity rules this respects:
  - Never duplicates a swap-target id: skeleton markup uses only classes,
    never id="orders-table" etc. Duplicating the target id inside itself
    would break hx-swap="outerHTML" (two elements with the same id).
  - Never replaces the target element itself: JS only swaps innerHTML and
    preserves the outer div + its id, so the outerHTML swap always lands.
  - Indicator lives outside every target (here, in the layout), so it is
    never removed by a swap.
*/}}
<template id="ordora-skeleton-table">
  <div class="ordora-skeleton" aria-hidden="true">
    <div class="ordora-skeleton-row ordora-skeleton-header">
      <span class="ordora-shimmer" style="width:18%"></span>
      <span class="ordora-shimmer" style="width:22%"></span>
      <span class="ordora-shimmer" style="width:26%"></span>
      <span class="ordora-shimmer" style="width:12%"></span>
    </div>
    <div class="ordora-skeleton-row"><span class="ordora-shimmer" style="width:14%"></span><span class="ordora-shimmer" style="width:24%"></span><span class="ordora-shimmer" style="width:30%"></span><span class="ordora-shimmer" style="width:10%"></span></div>
    <div class="ordora-skeleton-row"><span class="ordora-shimmer" style="width:16%"></span><span class="ordora-shimmer" style="width:20%"></span><span class="ordora-shimmer" style="width:28%"></span><span class="ordora-shimmer" style="width:12%"></span></div>
    <div class="ordora-skeleton-row"><span class="ordora-shimmer" style="width:13%"></span><span class="ordora-shimmer" style="width:26%"></span><span class="ordora-shimmer" style="width:24%"></span><span class="ordora-shimmer" style="width:11%"></span></div>
    <div class="ordora-skeleton-row"><span class="ordora-shimmer" style="width:15%"></span><span class="ordora-shimmer" style="width:22%"></span><span class="ordora-shimmer" style="width:27%"></span><span class="ordora-shimmer" style="width:10%"></span></div>
    <div class="ordora-skeleton-row"><span class="ordora-shimmer" style="width:17%"></span><span class="ordora-shimmer" style="width:21%"></span><span class="ordora-shimmer" style="width:25%"></span><span class="ordora-shimmer" style="width:12%"></span></div>
    <div class="ordora-skeleton-row"><span class="ordora-shimmer" style="width:14%"></span><span class="ordora-shimmer" style="width:23%"></span><span class="ordora-shimmer" style="width:29%"></span><span class="ordora-shimmer" style="width:10%"></span></div>
  </div>
</template>
<template id="ordora-skeleton-card">
  <div class="ordora-skeleton ordora-skeleton-card" aria-hidden="true">
    <div class="ordora-skeleton-title"><span class="ordora-shimmer" style="width:42%"></span></div>
    <div class="ordora-skeleton-line"><span class="ordora-shimmer" style="width:92%"></span></div>
    <div class="ordora-skeleton-line"><span class="ordora-shimmer" style="width:78%"></span></div>
    <div class="ordora-skeleton-line"><span class="ordora-shimmer" style="width:64%"></span></div>
  </div>
</template>
<template id="ordora-skeleton-list">
  <div class="ordora-skeleton ordora-skeleton-list" aria-hidden="true">
    <div class="ordora-skeleton-item"><span class="ordora-shimmer" style="width:34%"></span><span class="ordora-shimmer" style="width:18%"></span></div>
    <div class="ordora-skeleton-item"><span class="ordora-shimmer" style="width:28%"></span><span class="ordora-shimmer" style="width:22%"></span></div>
    <div class="ordora-skeleton-item"><span class="ordora-shimmer" style="width:31%"></span><span class="ordora-shimmer" style="width:15%"></span></div>
  </div>
</template>
{{ end }}
