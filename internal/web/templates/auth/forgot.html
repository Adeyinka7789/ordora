{{ define "auth/forgot.html" }}
<h1>Reset your password</h1>

{{ if .Error }}<div class="flash flash-error">{{ .Error }}</div>{{ end }}
{{ if .Notice }}<div class="flash flash-notice">{{ .Notice }}</div>{{ end }}

<p class="auth-sub">Enter the email you registered with. If it matches an account, we'll send a reset link.</p>

<form method="post" action="/password/forgot" class="form">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

  <label>
    Email
    <input type="email" name="email" value="{{ .Email }}" required autofocus>
  </label>

  <button type="submit" class="btn-primary">Send reset link</button>
</form>

<p class="auth-alt"><a href="/login">Back to sign in</a></p>
{{ end }}
