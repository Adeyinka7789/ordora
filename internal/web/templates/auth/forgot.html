{{ define "auth/forgot.html" }}
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight mb-space-sm">Reset your password</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-space-lg">Enter the email you registered with. If it matches an account, we'll send a reset link.</p>

{{ if .Error }}<div class="mb-space-md p-space-sm rounded bg-error-container text-on-error-container font-label-md text-label-md">{{ .Error }}</div>{{ end }}
{{ if .Notice }}<div class="mb-space-md p-space-sm rounded bg-tertiary-fixed text-on-tertiary-fixed font-label-md text-label-md">{{ .Notice }}</div>{{ end }}

<form method="post" action="/password/forgot" class="flex flex-col gap-space-md">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

  <label class="flex flex-col gap-1">
    <span class="font-label-md text-label-md text-on-surface">Email</span>
    <input type="email" name="email" value="{{ .Email }}" required autofocus
           class="h-10 px-3 rounded bg-surface-container-low text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container">
  </label>

  <button type="submit" class="h-10 rounded bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md font-semibold transition-colors">Send reset link</button>
</form>

<p class="text-center font-label-md text-label-md text-on-surface-variant mt-space-lg">
  <a href="/login" class="text-primary hover:underline">Back to sign in</a>
</p>
{{ end }}
