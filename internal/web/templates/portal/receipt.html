{{ define "portal/receipt.html" }}
<div class="rcpt-page w-full max-w-[720px] mx-auto px-margin md:px-margin-desktop py-space-lg md:py-space-xl flex flex-col gap-space-lg">

  <div class="no-print flex flex-wrap items-center justify-between gap-space-sm">
    <div class="flex flex-col">
      <span class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant font-semibold">{{ .OrgName }}</span>
      <h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight">Your receipt</h1>
    </div>
    <div class="flex flex-wrap items-center gap-space-xs">
      <button type="button" onclick="window.print()" class="h-9 px-space-md rounded bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md font-semibold flex items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[18px]">print</span>
        <span>Print / PDF</span>
      </button>
      <button type="button" id="receipt-png-btn" class="h-9 px-space-md rounded bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md font-semibold flex items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[18px]">image</span>
        <span>Save image</span>
      </button>
    </div>
  </div>

  {{ template "receipts/_card.html" .Card }}
</div>

<script src="/static/js/receipt.js" defer></script>
{{ end }}
