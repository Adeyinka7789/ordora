{{ define "layouts/admin_login.html" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ with .Data }}{{ if .Title }}{{ .Title }} — Ordora Admin{{ else }}Ordora Admin{{ end }}{{ else }}Ordora Admin{{ end }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="csrf-token" content="{{ csrfToken .Data }}">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface": "#F7FAFD",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#EDF3F8",
            "on-surface": "#0B1C30",
            "on-surface-variant": "#44566A",
            "primary": "#005A8C",
            "on-primary": "#ffffff",
            "primary-container": "#0077BE",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "outline-variant": "#C3D2DE"
          },
          spacing: {
            "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "0.75rem",
            "space-lg": "1.25rem", "space-xl": "2rem"
          },
          fontFamily: { "body-md": ["Inter"], "headline-lg": ["Inter"], "label-md": ["Inter"] },
          fontSize: {
            "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "body-md": ["13px", { lineHeight: "18px", fontWeight: "400" }],
            "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }]
          }
        }
      }
    };
  </script>
  <style>.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style>
</head>
<body class="bg-surface font-body-md text-on-surface">

  <div class="w-full bg-error text-on-error px-space-lg py-2 flex items-center justify-center text-label-md font-label-md">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-[18px]">shield_person</span>
      <span class="font-bold uppercase tracking-wider">Platform Admin</span>
      <span class="opacity-80">— every action is logged</span>
    </div>
  </div>

  <div class="min-h-[calc(100vh-40px)] flex items-center justify-center p-space-md">
    <div class="w-full max-w-md">
      <div class="flex flex-col items-center mb-space-lg">
        <img src="/static/logo.svg" alt="Ordora" class="h-12 w-12">
        <span class="font-headline-lg text-headline-lg font-bold tracking-tight mt-2">Ordora Admin</span>
      </div>
      <div class="bg-surface-container-lowest rounded-xl shadow-sm p-space-xl">
        {{ .Content }}
      </div>
      <p class="text-center text-label-md text-on-surface-variant mt-space-md">
        Authorized personnel only.
      </p>
    </div>
  </div>

</body>
</html>
{{ end }}
