{{ define "layouts/app.html" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ with .Data }}{{ if .Title }}{{ .Title }} — Ordora{{ else }}Ordora{{ end }}{{ else }}Ordora{{ end }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ordora">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="csrf-token" content="{{ csrfToken .Data }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface-container-highest": "#d3e4fe",
            "secondary": "#565e74",
            "surface-container": "#e5eeff",
            "on-error-container": "#93000a",
            "on-primary-fixed-variant": "#3323cc",
            "surface-container-high": "#dce9ff",
            "error": "#ba1a1a",
            "surface-container-lowest": "#ffffff",
            "secondary-fixed-dim": "#bec6e0",
            "on-primary-fixed": "#0f0069",
            "surface-dim": "#cbdbf5",
            "inverse-on-surface": "#eaf1ff",
            "error-container": "#ffdad6",
            "on-surface": "#0b1c30",
            "on-tertiary": "#ffffff",
            "surface-bright": "#f8f9ff",
            "primary-fixed": "#e2dfff",
            "primary-container": "#4f46e5",
            "tertiary-fixed-dim": "#4edea3",
            "primary-fixed-dim": "#c3c0ff",
            "outline-variant": "#c7c4d8",
            "on-tertiary-container": "#67f4b7",
            "surface-container-low": "#eff4ff",
            "background": "#f8f9ff",
            "surface-variant": "#d3e4fe",
            "on-primary": "#ffffff",
            "primary": "#3525cd",
            "on-tertiary-fixed-variant": "#005236",
            "tertiary": "#005338",
            "on-secondary": "#ffffff",
            "surface-tint": "#4d44e3",
            "on-secondary-fixed": "#131b2e",
            "on-secondary-fixed-variant": "#3f465c",
            "outline": "#777587",
            "secondary-fixed": "#dae2fd",
            "on-surface-variant": "#464555",
            "surface": "#f8f9ff",
            "inverse-surface": "#213145",
            "on-background": "#0b1c30",
            "on-error": "#ffffff",
            "on-tertiary-fixed": "#002113",
            "on-primary-container": "#dad7ff",
            "on-secondary-container": "#5c647a",
            "secondary-container": "#dae2fd",
            "tertiary-fixed": "#6ffbbe",
            "tertiary-container": "#006e4b",
            "inverse-primary": "#c3c0ff"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          spacing: {
            "margin-desktop": "2rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "gutter-desktop": "1.5rem",
            "margin": "1rem",
            "space-xl": "2rem",
            "space-md": "0.75rem",
            "space-lg": "1.25rem",
            "gutter": "1rem"
          },
          fontFamily: {
            "body-lg": ["Inter"],
            "headline-md": ["Inter"],
            "headline-lg": ["Inter"],
            "label-md": ["Inter"],
            "body-md": ["Inter"],
            "label-sm": ["Inter"],
            "code-md": ["Inter"],
            "display-lg": ["Inter"],
            "body-sm": ["Inter"]
          },
          fontSize: {
            "body-lg": ["15px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "400" }],
            "headline-md": ["18px", { lineHeight: "24px", letterSpacing: "-0.015em", fontWeight: "600" }],
            "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "600" }],
            "body-md": ["13px", { lineHeight: "18px", letterSpacing: "-0.005em", fontWeight: "400" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "500" }],
            "code-md": ["12px", { lineHeight: "16px", letterSpacing: "-0.01em", fontWeight: "500" }],
            "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.025em", fontWeight: "700" }],
            "body-sm": ["12px", { lineHeight: "16px", letterSpacing: "0em", fontWeight: "400" }]
          }
        }
      }
    };
  </script>

  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" defer></script>
  <script>
    document.addEventListener('htmx:configRequest', function (e) {
      var meta = document.querySelector('meta[name="csrf-token"]');
      if (meta && meta.content) {
        e.detail.headers['X-CSRF-Token'] = meta.content;
      }
    });
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c7c4d8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a09db6; }
  </style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">

  {{ template "partials/sidebar.html" . }}

  <div class="pl-64 flex flex-col min-h-screen">
    {{ template "partials/topbar.html" . }}
    <main class="w-full pt-16 flex-1 bg-surface">
      {{ .Content }}
    </main>
  </div>

    <!-- PWA install banner (hidden by default; shown if the browser offers install) -->
  <div id="pwa-install-banner" class="hidden fixed bottom-space-md left-1/2 -translate-x-1/2 z-50 bg-surface-container-lowest shadow-lg border border-outline-variant/30 rounded-xl p-space-md flex items-center gap-space-md max-w-sm">
    <img src="/static/logo.svg" alt="Ordora" class="w-10 h-10 flex-shrink-0">
    <div class="flex flex-col gap-1 flex-1 min-w-0">
      <span class="font-label-md text-label-md font-bold text-on-surface">Install Ordora</span>
      <span class="font-body-sm text-body-sm text-on-surface-variant">Add to your home screen for quick access.</span>
    </div>
    <div class="flex items-center gap-space-xs flex-shrink-0">
      <button id="pwa-install-btn" class="h-8 px-3 rounded bg-primary-container hover:bg-primary text-on-primary font-label-sm text-label-sm font-semibold">Install</button>
      <button id="pwa-install-dismiss" class="p-1 rounded hover:bg-surface-container-low text-on-surface-variant">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  </div>

  <script src="/static/js/pwa.js" defer></script>
</body>
</html>
{{ end }}
