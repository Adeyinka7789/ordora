<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#f8f9ff;font-family:Inter,Helvetica,Arial,sans-serif;color:#0b1c30;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,0.06);">
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:600;">Reset your password</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:22px;color:#464555;">
          Hi {{.Name}}, we received a request to reset your Ordora password. Click the button below to choose a new one.
        </p>
        <a href="{{.ResetURL}}" style="display:inline-block;padding:12px 20px;background:#4f46e5;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;font-size:14px;">Reset password</a>
        <p style="margin:24px 0 0;font-size:12px;color:#777587;">This link expires in 1 hour. If you didn't request a reset, you can safely ignore this email.</p>
      </td>
    </tr>
  </table>
</body>
</html>
