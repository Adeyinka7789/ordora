<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#f7fafa;font-family:Inter,Helvetica,Arial,sans-serif;color:#0c2226;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,0.06);">
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:600;">Welcome to Ordora, {{.Name}}</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:22px;color:#455556;">
          You're one click away from activating your account for <strong>{{.OrgName}}</strong>. Confirm your email address below.
        </p>
        <a href="{{.VerifyURL}}" style="display:inline-block;padding:12px 20px;background:#005f6b;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;font-size:14px;">Verify my email</a>
        <p style="margin:24px 0 0;font-size:12px;line-height:18px;color:#767f80;">
          If the button doesn't work, copy this link into your browser:<br>
          <a href="{{.VerifyURL}}" style="color:#005f6b;word-break:break-all;">{{.VerifyURL}}</a>
        </p>
        <p style="margin:24px 0 0;font-size:12px;color:#767f80;">This link expires in 24 hours.</p>
      </td>
    </tr>
  </table>
</body>
</html>
