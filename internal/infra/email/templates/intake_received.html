<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#F7FAFD;font-family:Inter,Helvetica,Arial,sans-serif;color:#0B1C30;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,0.06);">
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:600;">New order request</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:22px;color:#44566A;">
          {{.CustomerName}} submitted a new order request through your public form.
        </p>
        <table width="100%" cellpadding="0" cellspacing="0" style="background:#E1EAF2;border-radius:8px;">
          <tr><td style="padding:16px;">
            <p style="margin:0 0 4px;font-size:12px;color:#44566A;">Reference</p>
            <p style="margin:0 0 12px;font-size:16px;font-weight:600;">{{.OrderNumber}}</p>
            <p style="margin:0 0 4px;font-size:12px;color:#44566A;">Contact</p>
            <p style="margin:0 0 12px;font-size:14px;">{{.CustomerName}} &middot; {{.CustomerEmail}}{{if .CustomerPhone}} &middot; {{.CustomerPhone}}{{end}}</p>
            <p style="margin:0 0 4px;font-size:12px;color:#44566A;">Request</p>
            <p style="margin:0;font-size:14px;white-space:pre-wrap;">{{.Description}}</p>
          </td></tr>
        </table>
        <a href="{{.AdminURL}}" style="display:inline-block;margin-top:24px;padding:12px 20px;background:#0077BE;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;font-size:14px;">View and confirm</a>
      </td>
    </tr>
  </table>
</body>
</html>
