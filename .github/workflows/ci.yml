name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      ORDORA_ENV: development
      ORDORA_BASE_URL: http://localhost:8080
      ORDORA_HTTP_ADDR: :8080
      ORDORA_DB_HOST: localhost
      ORDORA_DB_PORT: "5432"
      ORDORA_DB_NAME: ordora_test
      ORDORA_DB_USER: postgres
      ORDORA_DB_PASSWORD: postgres
      ORDORA_DB_SSLMODE: disable
      ORDORA_DB_ADMIN_USER: postgres
      ORDORA_DB_ADMIN_PASSWORD: postgres
      ORDORA_SESSION_COOKIE_NAME: ordora_session
      ORDORA_CSRF_COOKIE_NAME: ordora_csrf
      ORDORA_SESSION_TTL_HOURS: "720"
      ORDORA_EMAIL_MODE: console
      ORDORA_EMAIL_FROM: no-reply@ordora.local
      ORDORA_STORAGE_MODE: local
      ORDORA_STORAGE_LOCAL_DIR: ./uploads

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Install pg_trgm extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ordora_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Create roles for RLS
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ordora_test <<'SQL'
            CREATE ROLE ordora_admin WITH LOGIN PASSWORD 'admin' BYPASSRLS;
            CREATE ROLE ordora_app   WITH LOGIN PASSWORD 'app' NOBYPASSRLS;
            GRANT CONNECT ON DATABASE ordora_test TO ordora_app, ordora_admin;
            GRANT USAGE ON SCHEMA public TO ordora_app, ordora_admin;
            ALTER SCHEMA public OWNER TO ordora_admin;
            ALTER DEFAULT PRIVILEGES FOR ROLE ordora_admin IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ordora_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE ordora_admin IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO ordora_app;
          SQL

      - name: Run migrations
        env:
          ORDORA_DB_ADMIN_USER: ordora_admin
          ORDORA_DB_ADMIN_PASSWORD: admin
        run: go run ./cmd/migrate

      - name: Run tests
        env:
          ORDORA_DB_USER: ordora_app
          ORDORA_DB_PASSWORD: app
        run: go test -race -timeout=5m ./...
